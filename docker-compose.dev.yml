version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: todo-sevilla-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todosevilla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todosevillapass}
      POSTGRES_DB: ${POSTGRES_DB:-todosevilla_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
