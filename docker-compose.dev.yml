version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: todosevilla_db_dev
    environment:
      POSTGRES_USER: todosevilla_dev
      POSTGRES_PASSWORD: todosevilla_dev_pass
      POSTGRES_DB: todosevilla_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
