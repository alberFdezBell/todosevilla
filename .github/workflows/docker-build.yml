name: Build y Publicar Imagen Docker en GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Compilar y publicar imagen
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # Necesario para publicar en GitHub Container Registry

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Extraer SHA del commit (7 caracteres)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y publicar imagen Docker (app)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Publicamos con el tag 'latest' y también con el SHA del commit para control de versiones
          tags: |
            ghcr.io/alberfdezbell/todosevilla:latest
            ghcr.io/alberfdezbell/todosevilla:${{ steps.vars.outputs.sha_short }}
          # Inyectamos el SHA del commit como variable de build de Next.js
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          # Caché de capas para acelerar builds sucesivos
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compilar y publicar imagen Docker (proxy)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/alberfdezbell/todosevilla-proxy:latest
            ghcr.io/alberfdezbell/todosevilla-proxy:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
