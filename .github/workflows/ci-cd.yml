name: CI — Todo Sevilla

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          # Build-time placeholder — la app real usa DATABASE_URL del contenedor
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
