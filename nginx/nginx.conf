events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Habilitar compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Resolver del DNS interno de Docker (127.0.0.11).
    # Necesario para usar proxy_pass con variable: nginx resuelve "app" en tiempo de
    # ejecución en lugar de en el arranque. Con endpoint_mode: dnsrr el DNS de Swarm
    # solo publica el nombre del servicio cuando tiene tareas vivas, y si nginx
    # resolviera al boot (sin variable) abortaría con "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Servidor HTTPS Local para Panel de Administración (Puerto 443 local -> 8080 en host)
    server {
        listen 443 ssl;
        server_name 192.168.0.60 localhost;

        # Certificados SSL autofirmados
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/todosevilla_admin_access.log;
        error_log  /var/log/nginx/todosevilla_admin_error.log;

        # Permite el acceso total (incluyendo /panel)
        location / {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 2. Servidor HTTP para Tráfico Público de Cloudflare (Puerto 80 interno de la red Docker)
    server {
        listen 80;
        server_name todosevilla.aferbel.es;

        access_log /var/log/nginx/todosevilla_public_access.log;
        error_log  /var/log/nginx/todosevilla_public_error.log;

        # Bloqueo físico infranqueable en red: el panel de administración no es accesible desde el túnel
        location /panel {
            return 403 "Acceso Denegado: El panel de administracion solo es accesible en red local.";
        }

        # Bloqueo físico de APIs de sistema
        location /api/system {
            return 403 "Acceso Denegado: Operacion no permitida desde el exterior.";
        }

        # Permitir el acceso al resto de la aplicación pública
        location / {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
