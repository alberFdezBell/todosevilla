version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: todosevilla_db
    environment:
      POSTGRES_USER: ${DB_USER:-todosevilla_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todosevilla_secure_pass}
      POSTGRES_DB: ${DB_NAME:-todosevilla}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todosevilla_net
    deploy:
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  app:
    image: ghcr.io/alberfdezbell/todosevilla:latest
    environment:
      # ?schema=public es exclusivo del driver de Prisma. El entrypoint.sh deriva
      # una URL "libpq-safe" (sin query string) para pg_isready/psql/pg_dump.
      DATABASE_URL: postgresql://${DB_USER:-todosevilla_admin}:${DB_PASSWORD:-todosevilla_secure_pass}@db:5432/${DB_NAME:-todosevilla}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORTAINER_WEBHOOK_URL: ${PORTAINER_WEBHOOK_URL}
      # GIT_COMMIT_SHA se omite a propósito: el SHA real se inyecta en la imagen
      # durante el build (ARG GIT_COMMIT_SHA en GitHub Actions). Si se redefiniera
      # aquí (aunque sea como valor vacío) SOBRESCRIBIRÍA al de la imagen y rompería
      # el comparador de actualizaciones del panel.
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - backups:/backups
    networks:
      - todosevilla_net
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    healthcheck:
      # Healthcheck robusto con node (siempre presente en la imagen). El wget de
      # BusyBox no soporta todos los flags (-q/--spider/--no-verbose) y podía
      # marcar el contenedor "unhealthy" de forma falsa (exit 137 = matado por
      # Swarm). Con node usamos el módulo core http.get: 0 si la API responde 200.
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).setTimeout(4000,()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - db

  # Proxy inverso local Nginx para HTTPS en red local en el puerto 8080.
  # Imagen propia (todosevilla-proxy) que incluye el nginx.conf corregido
  # (resolver dinámico de Swarm) y genera sus certificados autofirmados en el
  # arranque: NO depende de archivos del host (/opt/todosevilla/nginx).
  proxy:
    image: ghcr.io/alberfdezbell/todosevilla-proxy:latest
    container_name: todosevilla_proxy
    ports:
      # Exposición local del panel (https://192.168.0.60:8080). Se publica con
      # mode: host (sin routing mesh / ingress) para que sea compatible con
      # endpoint_mode: dnsrr y no dependa del IPVS (roto en LXC de Proxmox).
      - mode: host
        target: 443
        published: 8080
    environment:
      # CN para el certificado autofirmado generado en el arranque
      PROXY_CERT_CN: ${PROXY_CERT_CN:-192.168.0.60}
    volumes:
      # Persistir los certificados autogenerados entre reinicios
      - proxy_certs:/etc/nginx/certs
    networks:
      - todosevilla_net
    deploy:
      # dnsrr: el DNS devuelve la IP real de la tarea (sin VIP). Es la misma
      # solución que db y app para evitar el IPVS en LXC de Proxmox. Necesario
      # para que cloudflared (http://proxy:80) y nginx conecten directamente
      # y no se queden en i/o timeout contra el VIP.
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
    depends_on:
      - app

  # Servicio de Cloudflare Tunnel gestionado en el stack
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: todosevilla_tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - todosevilla_net
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - app

volumes:
  pgdata:
  backups:
  proxy_certs:

networks:
  todosevilla_net:
    driver: overlay
    attachable: true
