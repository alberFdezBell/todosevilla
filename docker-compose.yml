version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: todosevilla_db
    environment:
      POSTGRES_USER: ${DB_USER:-todosevilla_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todosevilla_secure_pass}
      POSTGRES_DB: ${DB_NAME:-todosevilla}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todosevilla_net
    deploy:
      restart_policy:
        condition: on-failure

  app:
    image: ghcr.io/alberfdezbell/todosevilla:latest
    environment:
      DATABASE_URL: postgresql://${DB_USER:-todosevilla_admin}:${DB_PASSWORD:-todosevilla_secure_pass}@db:5432/${DB_NAME:-todosevilla}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORTAINER_WEBHOOK_URL: ${PORTAINER_WEBHOOK_URL}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - backups:/backups
    networks:
      - todosevilla_net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - db

  # Proxy inverso local Nginx para HTTPS en red local en el puerto 8080
  proxy:
    image: nginx:alpine
    container_name: todosevilla_proxy
    ports:
      # Expone el panel solo en el puerto 8080 para toda la red local
      - "8080:443"
    volumes:
      - /opt/todosevilla/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/todosevilla/nginx/certs:/etc/nginx/certs
    networks:
      - todosevilla_net
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - app

  # Servicio de Cloudflare Tunnel gestionado en el stack
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: todosevilla_tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - todosevilla_net
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - app

volumes:
  pgdata:
  backups:

networks:
  todosevilla_net:
    driver: overlay
    attachable: true
