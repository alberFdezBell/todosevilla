version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: todosevilla_db
    environment:
      POSTGRES_USER: ${DB_USER:-todosevilla_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todosevilla_secure_pass}
      POSTGRES_DB: ${DB_NAME:-todosevilla}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todosevilla_net
    deploy:
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  app:
    image: ghcr.io/alberfdezbell/todosevilla:latest
    environment:
      # ?schema=public es exclusivo del driver de Prisma. El entrypoint.sh deriva
      # una URL "libpq-safe" (sin query string) para pg_isready/psql/pg_dump.
      DATABASE_URL: postgresql://${DB_USER:-todosevilla_admin}:${DB_PASSWORD:-todosevilla_secure_pass}@db:5432/${DB_NAME:-todosevilla}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PORTAINER_WEBHOOK_URL: ${PORTAINER_WEBHOOK_URL}
      # GIT_COMMIT_SHA se omite a propósito: el SHA real se inyecta en la imagen
      # durante el build (ARG GIT_COMMIT_SHA en GitHub Actions). Si se redefiniera
      # aquí (aunque sea como valor vacío) SOBRESCRIBIRÍA al de la imagen y rompería
      # el comparador de actualizaciones del panel.
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - backups:/backups
    networks:
      - todosevilla_net
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    healthcheck:
      # wget de BusyBox: usar -q y --spider (--no-verbose no existe en busybox)
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - db

  # Proxy inverso local Nginx para HTTPS en red local en el puerto 8080.
  # Imagen propia (todosevilla-proxy) que incluye el nginx.conf corregido
  # (resolver dinámico de Swarm) y genera sus certificados autofirmados en el
  # arranque: NO depende de archivos del host (/opt/todosevilla/nginx).
  proxy:
    image: ghcr.io/alberfdezbell/todosevilla-proxy:latest
    container_name: todosevilla_proxy
    ports:
      # Expone el panel solo en el puerto 8080 para toda la red local
      - "8080:443"
    environment:
      # CN para el certificado autofirmado generado en el arranque
      PROXY_CERT_CN: ${PROXY_CERT_CN:-192.168.0.60}
    volumes:
      # Persistir los certificados autogenerados entre reinicios
      - proxy_certs:/etc/nginx/certs
    networks:
      - todosevilla_net
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - app

  # Servicio de Cloudflare Tunnel gestionado en el stack
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: todosevilla_tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - todosevilla_net
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - app

volumes:
  pgdata:
  backups:
  proxy_certs:

networks:
  todosevilla_net:
    driver: overlay
    attachable: true
